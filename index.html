<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroStock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&v=2');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e}
.hidden{display:none!important}
.topbar{background:linear-gradient(135deg,#0a0e1a,#0f172a 30%,#1a2744 50%,#0f172a 70%,#0a0e1a);padding:0 24px;height:80px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 24px rgba(0,0,0,.3);position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:14px}
.topbar-logo .icon{width:40px;height:40px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.topbar-brand{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
.topbar-brand .brand-name{font-size:26px;font-weight:800;background:linear-gradient(135deg,#e2e8f0,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-transform:uppercase}
.topbar-brand .brand-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.35);letter-spacing:3px;text-transform:uppercase;margin-top:-2px}
.topbar .badge{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.08)}
#app{max-width:1200px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:0;margin-bottom:16px;background:#fff;border-radius:14px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.04);flex-wrap:wrap}
.tab{flex:1;min-width:100px;padding:12px 16px;border:none;background:0 0;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-radius:11px;transition:all .15s;font-family:'Inter',sans-serif;text-align:center}
.tab:hover{color:#334155;background:#f1f5f9}
.tab.active{background:#1e3a5f;color:#fff;box-shadow:0 2px 8px rgba(30,58,95,.3)}
.toolbar{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.search-wrap input{width:100%;padding:14px 16px 14px 44px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;outline:0;transition:border .2s}
.search-wrap input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn{padding:12px 20px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4)}
.btn-success{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-ghost:hover{background:#e2e8f0}
.table-wrap{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;color:#475569;padding:14px 20px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #e2e8f0;cursor:pointer}
th:hover{color:#1e40af}
td{padding:14px 20px;font-size:14px;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
.cell-click{cursor:pointer;color:#1e40af;font-weight:600}
.cell-click:hover{text-decoration:underline;color:#2563eb}
.cell-mpn{font-family:'Cascadia Code',monospace;font-size:13px;color:#6366f1}
.cell-ccn{font-family:'Cascadia Code',monospace;font-size:13px;color:#64748b}
.cell-img{width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;font-size:15px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:20px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:24px 28px 0}
.modal-header h2{font-size:20px;font-weight:700;color:#0f172a}
.modal-body{padding:8px 28px 24px}
.modal-body label{display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 4px}
.modal-body input[type=text]{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;outline:0}
.modal-body input[type=text]:focus{border-color:#3b82f6}
.modal-body input[type=file]{margin-top:8px;font-size:13px}
.modal-footer{padding:0 28px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.detail-field{background:#f8fafc;border-radius:10px;padding:14px 16px;margin-top:12px}
.detail-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px}
.detail-value{font-size:15px;color:#0f172a;font-weight:500;word-break:break-all}
.detail-img{max-width:100%;max-height:300px;border-radius:12px;margin-top:12px;display:block}
.thumb-preview{max-width:120px;max-height:80px;border-radius:8px;margin-top:8px;display:block}
.error-msg{background:#fef2f2;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:12px}
@media(max-width:768px){
.topbar{height:64px;padding:0 12px}
.topbar-logo .icon{width:32px;height:32px}
.topbar-logo>div>div:first-child{font-size:7px!important;letter-spacing:1px!important}
.topbar-brand .brand-name{font-size:18px;letter-spacing:2px}
.topbar-brand .brand-sub{font-size:7px;letter-spacing:1px}
.topbar .badge{font-size:11px;padding:4px 10px}
.toolbar{padding:14px;flex-direction:column}
.toolbar .btn{width:100%;justify-content:center}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:500px}
th{padding:10px 12px;font-size:10px}
td{padding:10px 12px;font-size:13px}
.modal{max-width:95%;border-radius:16px}
.modal-header{padding:20px 20px 0}
.modal-body{padding:4px 20px 16px}
.modal-footer{padding:0 20px 20px}
#app{padding:12px}
}
@media(max-width:580px){
.topbar-logo>div{display:none}
.topbar-brand .brand-name{font-size:16px;letter-spacing:2px}
.topbar-brand .brand-sub{display:none}
.topbar .badge{display:none}
}
@media(max-width:400px){
.topbar-logo .icon{width:28px;height:28px;border-radius:8px;font-size:18px}
.topbar-brand .brand-name{font-size:14px;letter-spacing:1px}
}
</style>
</head>

</div>

var tabs = {
  ingredients: { data: EMBED.slice(), sheet: "Feuille 1", hdrs: ["Designation","Libelle effectivite","PN","CCN"], labels: ["Libelle effectivite","PN","CCN"], title: "Catalogue des ingredients", add: "Nouvel ingredient" },
  pieces:     { data: [], sheet: "Pieces",   hdrs: ["Designation","PN","CCN","Type avion"], labels: ["PN","CCN","Type avion"], title: "Pieces recurrentes", add: "Nouvelle piece" },
  galere:     { data: [], sheet: "piece galere", hdrs: ["Designation","PN","CCN","Type avion"], labels: ["PN","CCN","Type avion"], title: "Outillages", add: "Nouvel outillage" }
};
var currentTab = "ingredients";
var sortField = "designation";
var sortDir = "asc";
var searchTimer;
var pendingImage = "";

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active")});
  document.getElementById(tab==="ingredients"?"tabIngredients":tab==="pieces"?"tabPieces":"tabGalere").classList.add("active");
  var t = tabs[tab];
  document.getElementById("brandSub").textContent = t.title;
  document.getElementById("btnAddText").textContent = t.add;
  document.getElementById("searchInput").value = "";
  sortField = "designation"; sortDir = "asc";
  updateUI();
  if (tab !== "ingredients" && !t.data.length) loadSheet(t.sheet, function(d){ tabs[tab].data = Array.isArray(d)?d:[]; if(currentTab===tab){ updateUI(); render(); } });
  render();
}

function cur() { return tabs[currentTab].data; }
function curTab() { return tabs[currentTab]; }
function findRow(id) { var a=cur(); for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];} return null; }
function findIdx(id) { var a=cur(); for(var i=0;i<a.length;i++){if(a[i].id===id)return i;} return -1; }
function updateUI() { 
  document.getElementById("totalBadge").textContent = cur().length + " element(s)";
  document.getElementById("countIngredients").textContent = tabs.ingredients.data.length;
  document.getElementById("countPieces").textContent = tabs.pieces.data.length;
  document.getElementById("countGalere").textContent = tabs.galere.data.length;
}

function loadSheet(sheet, cb) {
  fetch(API+"?sheet="+encodeURIComponent(sheet))
    .then(function(r){return r.json()})
    .then(function(d){ if(cb) cb(Array.isArray(d)?d:[]); })
    .catch(function(){});
}

setTimeout(function(){
  loadSheet("Feuille 1", function(d){ if(d.length){ tabs.ingredients.data=d; if(currentTab==="ingredients"){ updateUI(); render(); } } });
  loadSheet("Pieces", function(d){ tabs.pieces.data=d; if(currentTab==="pieces"){ updateUI(); render(); } });
  loadSheet("piece galere", function(d){ tabs.galere.data=d; if(currentTab==="galere"){ updateUI(); render(); } });
}, 200);

function render() {
  var all = cur();
  var t = curTab();
  var dataFields = ["designation","col2","col3","col4","col5"];
  var numCols = t.hdrs.length;
  var hasImg = all.some(function(r){return r.image;});
  var hdrs = hasImg ? t.hdrs.concat(["Photo"]) : t.hdrs;
  document.getElementById("tableHead").innerHTML = "<tr>"+hdrs.map(function(h,i){
    return i<numCols?"<th onclick=\"sortBy('"+dataFields[i]+"')\">"+h+"</th>":"<th>"+h+"</th>";
  }).join("")+"</tr>";
  var q = document.getElementById("searchInput").value.toLowerCase();
  var list = all.filter(function(row){
    if(!q)return true;
    for(var k in row){if(k!=="image"&&String(row[k]||"").toLowerCase().indexOf(q)!==-1)return true;}
    return false;
  });
  list.sort(function(a,b){
    var va=String(a[sortField]||"").toLowerCase(),vb=String(b[sortField]||"").toLowerCase();
    if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;
  });
  var tbody = document.getElementById("tableBody");
  var totalCols = hasImg ? numCols+1 : numCols;
  if(!list.length){tbody.innerHTML="<tr><td colspan=\""+totalCols+"\"><div class=\"empty-state\">Aucun resultat</div></td></tr>";return;}
  tbody.innerHTML = list.map(function(row){
    var cells = "<td><span class=\"cell-click\" onclick=\"openDetail('"+row.id+"')\">"+esc(row.designation)+"</span></td>"+
      "<td>"+esc(row.col2)+"</td><td><span class=\"cell-mpn\">"+esc(row.col3)+"</span></td><td><span class=\"cell-ccn\">"+esc(row.col4)+"</span></td>";
    if(numCols>4) cells += "<td>"+esc(row.col5||"")+"</td>";
    if(hasImg) cells += "<td>"+(row.image?"<img class=\"cell-img\" src=\""+esc(row.image)+"\" onerror=\"this.style.display='none'\">":"")+"</td>";
    return "<tr>"+cells+"</tr>";
  }).join("");
}

function sortBy(f){if(sortField===f){sortDir=sortDir==="asc"?"desc":"asc"}else{sortField=f;sortDir="asc"}render();}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function openDetail(id){
  var row=findRow(id);if(!row)return;
  var t=curTab();
  var l=t.labels;
  var detailHtml = "<div class=\"detail-field\"><div class=\"detail-label\">"+l[0]+"</div><div class=\"detail-value\">"+esc(row.col2)+"</div></div>"+
    "<div class=\"detail-field\"><div class=\"detail-label\">"+l[1]+"</div><div class=\"detail-value\">"+esc(row.col3)+"</div></div>"+
    "<div class=\"detail-field\"><div class=\"detail-label\">"+l[2]+"</div><div class=\"detail-value\">"+esc(row.col4)+"</div></div>";
  if(l.length>3) detailHtml += "<div class=\"detail-field\"><div class=\"detail-label\">"+l[3]+"</div><div class=\"detail-value\">"+esc(row.col5||"")+"</div></div>";
  document.getElementById("modalBox").innerHTML=
    "<div class=\"modal-header\"><h2>"+esc(row.designation)+"</h2></div><div class=\"modal-body\">"+detailHtml+
    (row.image?"<img class=\"detail-img\" src=\""+esc(row.image)+"\" onerror=\"this.style.display='none'\">":"")+
    "</div><div class=\"modal-footer\">"+
    "<button class=\"btn btn-danger\" onclick=\"deleteItem('"+id+"')\">Supprimer</button>"+
    "<button class=\"btn btn-ghost\" onclick=\"openEdit('"+id+"')\">Modifier</button>"+
    "<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Fermer</button></div>";
  show("modalOverlay");
}

function openEdit(id){
  var row=id?findRow(id):null;

  var l=t.labels;

  document.getElementById("modalBox").innerHTML=
    "<div class=\"modal-header\"><h2>"+(id?"Modifier":t.add)+"</h2></div><div class=\"modal-body\">"+
    "<label>Designation</label><input type=\"text\" id=\"e-des\" value=\""+esc(row?row.designation:"")+"\">"+
    "<label>"+l[0]+"</label><input type=\"text\" id=\"e-c2\" value=\""+esc(row?row.col2:"")+"\">"+
    "<label>"+l[1]+"</label><input type=\"text\" id=\"e-c3\" value=\""+esc(row?row.col3:"")+"\">"+
    "<label>"+l[2]+"</label><input type=\"text\" id=\"e-c4\" value=\""+esc(row?row.col4:"")+"\">"+
    (l.length>3?"<label>"+l[3]+"</label><input type=\"text\" id=\"e-c5\" value=\""+esc(row?row.col5:"")+"\">":"")+
    "<label>Photo</label><input type=\"file\" id=\"e-img\" accept=\"image/*\" onchange=\"previewImage(this)\">"+
    (pendingImage?"<img class=\"thumb-preview\" id=\"imgPreview\" src=\""+esc(pendingImage)+"\">":"<img class=\"thumb-preview hidden\" id=\"imgPreview\">")+
    "<div class=\"error-msg hidden\" id=\"saveError\"></div></div><div class=\"modal-footer\">"+
    "<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Annuler</button>"+
    "<button class=\"btn btn-success\" id=\"btnSave\" onclick=\"saveItem('"+(id||"")+"')\">Enregistrer</button></div>";
  show("modalOverlay");
}

function previewImage(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var maxW = 400;
      var scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingImage = canvas.toDataURL("image/jpeg", 0.6);
      document.getElementById("imgPreview").src = pendingImage;
      document.getElementById("imgPreview").classList.remove("hidden");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveItem(id){
  var btn=document.getElementById("btnSave");btn.disabled=true;btn.textContent="Enregistrement...";
  var d=document.getElementById("e-des").value.trim();
  if(!d){err("La designation est obligatoire.");btn.disabled=false;btn.textContent="Enregistrer";return;}
  var t=curTab();
  var params = "action="+(id?"update":"add")+"&sheet="+encodeURIComponent(t.sheet)+
    "&designation="+encodeURIComponent(d)+
    "&col2="+encodeURIComponent(document.getElementById("e-c2").value.trim())+
    "&col3="+encodeURIComponent(document.getElementById("e-c3").value.trim())+
    "&col4="+encodeURIComponent(document.getElementById("e-c4").value.trim());
  if(t.labels.length>3) params += "&col5="+encodeURIComponent((document.getElementById("e-c5")||{value:""}).value.trim());
  if(id) params += "&id="+encodeURIComponent(id);
  if(pendingImage) params += "&image="+encodeURIComponent(pendingImage);

  var fetchOpts = params.length > 4000 ? { method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"}, body: params } : null;
  var url = fetchOpts ? API : API + "?" + params;

  fetch(url, fetchOpts || {}).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      if(id){var idx=findIdx(id);if(idx>=0)cur()[idx]={designation:d,col2:document.getElementById("e-c2").value.trim(),col3:document.getElementById("e-c3").value.trim(),col4:document.getElementById("e-c4").value.trim(),id:id,image:pendingImage,col5:(document.getElementById("e-c5")||{value:""}).value.trim()};}
      closeModal();updateUI();render();
      setTimeout(function(){loadSheet(t.sheet,function(d){tabs[currentTab].data=d;if(currentTab===currentTab){updateUI();render();}});},500);
    }else{err("Erreur: "+(res.error||"inconnue"));btn.disabled=false;btn.textContent="Enregistrer";}
  }).catch(function(){err("Serveur inaccessible");btn.disabled=false;btn.textContent="Enregistrer";});
}

var PIN = "4172";

function deleteItem(id){
  var row=findRow(id);if(!row)return;
  var p = prompt("Code PIN pour supprimer :");
  if (p !== PIN) { alert("Code PIN incorrect."); return; }
  if(!confirm("Supprimer \""+row.designation+"\" ?"))return;
  var t=curTab();
  var idx=findIdx(id);
  fetch(API+"?action=delete&sheet="+encodeURIComponent(t.sheet)+"&id="+encodeURIComponent(id))
    .then(function(r){return r.json()}).then(function(res){
      if(res.success||res.error==="ID introuvable"){
        if(idx>=0)cur().splice(idx,1);
        closeModal();updateUI();render();
        setTimeout(function(){loadSheet(t.sheet,function(d){tabs[currentTab].data=d;if(currentTab===currentTab){updateUI();render();}});},500);
      }
    }).catch(function(){});
}

function err(m){var e=document.getElementById("saveError");if(e){e.textContent=m;e.classList.remove("hidden")}}
function show(id){document.getElementById(id).classList.remove("hidden")}
function hide(id){document.getElementById(id).classList.add("hidden")}
function closeModal(){hide("modalOverlay")}
document.getElementById("modalOverlay").addEventListener("click",function(e){if(e.target===this)closeModal()});
document.getElementById("searchInput").addEventListener("input",function(){clearTimeout(searchTimer);searchTimer=setTimeout(render,150)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();if(e.ctrlKey&&e.key==="f"){e.preventDefault();document.getElementById("searchInput").focus()}});

updateUI();
render();
</script>
</body>
</html>
